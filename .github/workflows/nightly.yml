# The pipeline on GitHub's runners: new minutes in, a rebuilt explorer site out, in ONE Pages deployment.
#
# Three jobs, split on purpose:
#   run      reads the repo, holds the model token (CLAUDE_CODE_OAUTH_TOKEN), runs the agents on new minutes. Read-only:
#            it cannot write to the repo or publish anything.
#   build    no token, no write access, no model. Fetches the city's item records (free API calls), builds the explorer
#            site from them and from the published summaries, scans it for private strings and uploads it as the pages artifact.
#   publish  has write access (commit results to the `data` branch, deploy GitHub Pages) but no model token and never calls a
#            model. Runs only for a scheduled run, or a manual run with publish=true; never after a dry run.
#
# Safety for a public repo that holds a token secret:
#   - triggers: workflow_dispatch and (once the user turned it on) one schedule. No pull_request / pull_request_target / push /
#     issue_comment, so nobody's fork or comment can run it. Dispatch needs write access to this repo.
#   - top-level permissions: contents: read. Write permissions exist on the publish job only.
#   - every action is pinned to a full commit SHA (tag in the comment).
#   - the model token is set on exactly one step; inputs reach the shell only as env vars, validated first.
# Auth for the agents: Claude subscription, repo secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`).
name: nightly

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "document: one document, real agents, nothing published.  nightly: everything new in the last few days."
        type: choice
        options: [document, nightly]
        default: document
      since:
        description: "document mode: first meeting date (YYYY-MM-DD)"
        required: true
        default: "2026-10-22"
      until:
        description: "document mode: day after the last meeting date (YYYY-MM-DD)"
        required: true
        default: "2026-10-23"
      doc_id:
        description: "document mode: document to run through the agents"
        required: true
        default: "kc-19561-minutes"
      days:
        description: "nightly mode: look back this many days for new minutes"
        required: true
        default: "3"
      max_docs:
        description: "nightly mode: process at most this many documents"
        required: true
        default: "4"
      dry_run:
        description: "nightly mode: use the canned test agents and test data. No model calls, no plan usage, nothing publishable."
        type: boolean
        default: true
      publish:
        description: "nightly mode with dry_run off: commit results to the data branch and deploy the site. Needs the user's OK."
        type: boolean
        default: false
  # The schedule goes in only after the user's one updated run is verified:
  # schedule:
  #   - cron: "30 7 * * *"   # 07:30 UTC = 2:30 AM CDT

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.cfg.outputs.mode }}
      dry_run: ${{ steps.cfg.outputs.dry_run }}
      publish: ${{ steps.cfg.outputs.publish }}
      scheduled: ${{ steps.cfg.outputs.scheduled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code@2.1.312
      - run: claude --version
      - run: python scripts/check.py
      - name: Settle and check the settings
        id: cfg
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          DOC_ID: ${{ inputs.doc_id }}
          DAYS: ${{ inputs.days }}
          MAX_DOCS: ${{ inputs.max_docs }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            MODE=nightly; DRY_RUN=false; PUBLISH=true; DAYS=3; MAX_DOCS=4
            SINCE=2026-01-01; UNTIL=2026-01-02; DOC_ID=kc-0-minutes; SCHEDULED=true
          else
            SCHEDULED=false
          fi
          [[ "$MODE" =~ ^(document|nightly)$ ]] || { echo "bad mode"; exit 1; }
          [[ "$DAYS" =~ ^[0-9]{1,3}$ ]] || { echo "bad days"; exit 1; }
          [[ "$MAX_DOCS" =~ ^[0-9]{1,2}$ ]] || { echo "bad max_docs"; exit 1; }
          [[ "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad since"; exit 1; }
          [[ "$UNTIL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad until"; exit 1; }
          [[ "$DOC_ID" =~ ^kc-[0-9]+-(minutes|agenda)$ ]] || { echo "bad doc_id"; exit 1; }
          [[ "$DRY_RUN" =~ ^(true|false)$ ]] || { echo "bad dry_run"; exit 1; }
          [[ "$PUBLISH" =~ ^(true|false)$ ]] || { echo "bad publish"; exit 1; }
          {
            echo "mode=$MODE"; echo "dry_run=$DRY_RUN"; echo "publish=$PUBLISH"; echo "scheduled=$SCHEDULED"
            echo "days=$DAYS"; echo "max_docs=$MAX_DOCS"; echo "since=$SINCE"; echo "until=$UNTIL"; echo "doc_id=$DOC_ID"
          } >> "$GITHUB_OUTPUT"
      - name: Restore earlier results from the data branch
        if: ${{ steps.cfg.outputs.mode == 'nightly' && steps.cfg.outputs.dry_run == 'false' }}
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SHOWME_DATA_DIR: ${{ runner.temp }}/showme-data
        run: python scripts/publish_data.py --restore --data "$SHOWME_DATA_DIR" --remote "$REPO_URL"
      - name: Run the pipeline
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODE: ${{ steps.cfg.outputs.mode }}
          DRY_RUN: ${{ steps.cfg.outputs.dry_run }}
          DAYS: ${{ steps.cfg.outputs.days }}
          MAX_DOCS: ${{ steps.cfg.outputs.max_docs }}
          SINCE: ${{ steps.cfg.outputs.since }}
          UNTIL: ${{ steps.cfg.outputs.until }}
          DOC_ID: ${{ steps.cfg.outputs.doc_id }}
          SHOWME_DATA_DIR: ${{ runner.temp }}/showme-data
          SHOWME_SITE_DIR: ${{ runner.temp }}/showme-site
        run: |
          if [ "$MODE" = "document" ]; then
            python -m pipeline.run ingest --since "$SINCE" --until "$UNTIL" --limit 1
            python -m pipeline.run process "$DOC_ID"
            python -m pipeline.run build-site
            python -m pipeline.run report "$DOC_ID" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$DRY_RUN" = "true" ]; then
            python -m pipeline.run nightly --fixture --stub tests/fixtures/kansascity/stub --days 10 --loop-cap 4.00
          else
            python -m pipeline.run nightly --days "$DAYS" --max-docs "$MAX_DOCS" --loop-cap 4.00
          fi
      - name: Show what would be committed to the data branch (nothing is pushed)
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SHOWME_DATA_DIR: ${{ runner.temp }}/showme-data
        run: python scripts/publish_data.py --data "$SHOWME_DATA_DIR" --remote "$REPO_URL" --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showme-run
          path: |
            ${{ runner.temp }}/showme-data/published
            ${{ runner.temp }}/showme-data/state.json
            ${{ runner.temp }}/showme-data/metrics.jsonl
            ${{ runner.temp }}/showme-data/work/*/report.json
            ${{ runner.temp }}/showme-data/work/*/usage_meta.json
            ${{ runner.temp }}/showme-data/work/*/*.usage.json
          retention-days: 7
          if-no-files-found: error

  build:
    needs: run
    if: ${{ needs.run.outputs.mode == 'nightly' && needs.run.outputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showme-run
          path: ${{ runner.temp }}/showme-data
      - name: Fetch the city's item records (free API calls, no model)
        env:
          HISTORY_DIR: ${{ runner.temp }}/history
        run: |
          python scripts/backfill_rows.py --out "$HISTORY_DIR" || python scripts/backfill_rows.py --out "$HISTORY_DIR"
      - name: Build the explorer site
        env:
          HISTORY_DIR: ${{ runner.temp }}/history
          SITE_DIR: ${{ runner.temp }}/explorer
          DATA_DIR: ${{ runner.temp }}/showme-data
          SCHEDULED: ${{ needs.run.outputs.scheduled }}
        run: |
          EXTRA=""
          if [ "$SCHEDULED" = "true" ]; then EXTRA="--scheduled"; fi
          python -m pipeline.run explore-site --history "$HISTORY_DIR" --out "$SITE_DIR" \
            --published "$DATA_DIR/published" --metrics "$DATA_DIR/metrics.jsonl" \
            --labels site-inputs/labels/*.json --accuracy site-inputs/topic_accuracy.json $EXTRA
      - name: Scan the site for anything private
        env:
          SITE_DIR: ${{ runner.temp }}/explorer
        run: python scripts/scan_site.py "$SITE_DIR"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/explorer

  publish:
    needs: [run, build]
    if: ${{ needs.run.outputs.publish == 'true' && needs.run.outputs.mode == 'nightly' && needs.run.outputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showme-run
          path: ${{ runner.temp }}/showme-data
      - name: Commit the results to the data branch
        env:
          PUBLISH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SHOWME_DATA_DIR: ${{ runner.temp }}/showme-data
        run: python scripts/publish_data.py --data "$SHOWME_DATA_DIR" --remote "$REPO_URL"
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
